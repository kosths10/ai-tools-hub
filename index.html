<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Tools Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background-color: #ffffff; color: #000000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .container { text-align: center; }
    button { background: #28bdf8; color: #8f172a; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h2>AI Tools Hub 2026</h2>
    <p>Click the button below to watch the ad:</p>
    <button onclick="showAd()">Watch Ad</button>
    <div id="ad-container"></div>
  </div>

  <script>
    window.Telegram.WebApp.ready();

    function showAd() {
      try {
        if (typeof window.Adsgram === 'undefined') {
          alert("Adsgram SDK is still loading. Please wait.");
          return;
        }

        const ad = window.Adsgram.init({
          blockId: "49486",
          mode: "inline",
          container: document.getElementById("ad-container")
        });

        ad.show().then((result) => {
          alert("Reward earned successfully!");
        }).catch((err) => {
          alert("Ad error: " + JSON.stringify(err));
        });

      } catch (e) {
        alert("Exception: " + e.message);
      }
    }
  </script>
</body>
</html>
