<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h2>AI Tools Hub</h2>
    <p>Click the button below to watch the ad:</p>
    <button id="watch-ad-btn">Watch Ad</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        function loadAdsgramScript() {
            return new Promise((resolve, reject) => {
                if (typeof window.Adsgram !== 'undefined') {
                    resolve(window.Adsgram);
                    return;
                }
                const script = document.createElement('script');
                script.src = 'https://sad.adsgram.ai/js/sad.js';
                script.onload = () => resolve(window.Adsgram);
                script.onerror = () => reject(new Error('Failed to load Adsgram SDK'));
                document.head.appendChild(script);
            });
        }

        document.getElementById('watch-ad-btn').addEventListener('click', async () => {
            try {
                const Adsgram = await loadAdsgramScript();
                if (!Adsgram) {
                    alert("Adsgram SDK failed to initialize.");
                    return;
                }
                
                const adController = Adsgram.init({ blockId: "49486" });
                const result = await adController.show();
                
                alert("Ad completed successfully! You earned your reward.");

                const user = tg.initDataUnsafe?.user || { id: 'unknown', username: 'guest' };
                const scriptUrl = "https://script.google.com/macros/s/AKfycbyP-KgnVdBuE6FpjQvn42CJrCGQ0OEyI2-ct3nfkC0QDpl1CfFzUEus31hWM7FHgDBm2A/exec";
                
                fetch(scriptUrl, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        userId: user.id,
                        username: user.username,
                        action: "watched_ad"
                    })
                }).catch(err => console.log("Sheet sync note:", err));

            } catch (err) {
                console.error("Adsgram Error Details:", err);
                alert("Ad error: " + (err.message || JSON.stringify(err)));
            }
        });
    </script>
</body>
</html>
