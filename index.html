<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h2>AI Tools Hub</h2>
    <p>Click the button below to watch the ad:</p>
    <button id="watch-ad-btn">Watch Ad</button>

    <script>
        window.Telegram.WebApp.ready();

        document.getElementById('watch-ad-btn').addEventListener('click', async () => {
            if (typeof window.Adsgram === 'undefined') {
                alert("Adsgram SDK is still loading. Please wait a second and try again.");
                return;
            }

            try {
                const adController = window.Adsgram.init({ blockId: "49486" });
                const result = await adController.show();
                alert("Ad completed successfully! You earned your reward.");
            } catch (err) {
                console.error(err);
                alert("The ad was closed or an error occurred.");
            }
        });
    </script>
</body>
</html>
